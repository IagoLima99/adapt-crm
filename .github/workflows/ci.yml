name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-packages --dev

      - name: Lint Python
        run: uv run ruff check .

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Type-check Python
        shell: bash
        run: |
          targets=(tests scripts)
          if find apps -type f -name '*.py' -print -quit | grep -q .; then
            targets+=(apps)
          fi
          uv run mypy "${targets[@]}"

      - name: Check architecture conformance
        run: uv run python scripts/check_architecture.py

      - name: Test Python
        run: uv run pytest -q

  web-quality:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test web
        run: npm run test --workspace @adaptcrm/web

      - name: Lint web
        run: npm run lint --workspace @adaptcrm/web

      - name: Type-check web
        run: npm run typecheck --workspace @adaptcrm/web

      - name: Build web
        run: npm run build --workspace @adaptcrm/web

      - name: Build traceable source artifact
        shell: bash
        run: |
          mkdir -p build
          git archive --format=tar.gz --output=build/adaptcrm-source.tar.gz HEAD
          node apps/web/scripts/build-metadata.mjs build/metadata.json "${{ github.sha }}"

      - name: Upload traceable source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adaptcrm-build-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 7
