name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-quality:
    name: Clean bootstrap and quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify clean checkout preconditions
        shell: bash
        run: |
          test ! -e .env
          test ! -e .venv
          test ! -e node_modules

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          activate-environment: true
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked repository dependencies
        run: python scripts/repo.py install

      - name: Run repository quality gates
        run: python scripts/repo.py lint

      - name: Run repository tests
        run: python scripts/repo.py test

      - name: Build repository artifacts
        run: python scripts/repo.py build

      - name: Build traceable source artifact
        shell: bash
        run: |
          mkdir -p build
          git archive --format=tar.gz --output=build/adaptcrm-source.tar.gz HEAD
          node apps/web/scripts/build-metadata.mjs build/metadata.json "${{ github.sha }}"

      - name: Upload traceable source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adaptcrm-build-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 7
