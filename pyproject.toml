[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pyyaml>=6.0.3",
    "ruff",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.uv.workspace]
members = ["apps/api", "apps/worker"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "apps/worker"]
markers = [
    "integration: requires an ephemeral external service",
]
